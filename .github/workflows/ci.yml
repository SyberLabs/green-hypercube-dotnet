name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GreenHypercube.sln

      - name: Build
        run: dotnet build GreenHypercube.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/GreenHypercube.Tests/GreenHypercube.Tests.csproj --configuration Release --no-build
